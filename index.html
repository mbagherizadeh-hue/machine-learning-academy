<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Learning Academy | مرجع آموزشی یادگیری ماشین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#1c1917;--mu:#78716c;--or:#ea7a1a;--orl:#fff4e8;--bl:#1e3a5f;--bd:#e7e5e4}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:#fff;line-height:2;font-size:17px}
a{color:var(--or)}header{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--bd);padding:6px clamp(12px,3vw,40px)}
header b{color:var(--or);font-size:15px}nav{display:flex;flex-wrap:wrap;gap:2px}nav a{padding:0 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}nav a:hover,nav a.on{background:var(--orl);color:var(--or)}
main{max-width:1050px;margin:auto;padding:28px clamp(14px,4vw,40px) 70px}
h1{font-size:2.3em;margin:.1em 0;color:var(--bl)}h2{color:var(--bl);border-bottom:2px solid var(--or);padding-bottom:2px;margin-top:1.6em}h3{margin:.2em 0;color:var(--bl)}
.hero{background:var(--orl);border-radius:18px;padding:26px clamp(16px,4vw,40px);border-inline-start:6px solid var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--bd);border-radius:14px;padding:12px 18px;background:#fff;transition:.2s}.card:hover{border-color:var(--or);transform:translateY(-2px)}
.tag,.st{display:inline-block;font-size:12px;border-radius:20px;padding:0 10px;background:var(--orl);color:var(--or)}.st{background:#f5f5f4;color:var(--mu)}.st.ok{background:#dcfce7;color:#166534}
.btn{display:inline-block;background:var(--or);color:#fff;border:0;border-radius:10px;padding:2px 16px;text-decoration:none;font:inherit;font-size:15px;cursor:pointer;margin:2px}.btn.s{background:#fff;color:var(--or);border:1px solid var(--or)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;direction:ltr;margin:12px 0}.flow span{background:var(--orl);border:1px solid var(--or);border-radius:10px;padding:0 14px;font-size:15px}.flow i{color:var(--mu);font-style:normal}
.venn{direction:ltr;text-align:center;border:2px solid var(--bl);border-radius:20px;padding:12px;max-width:520px;margin:14px auto}.venn div{border:2px solid var(--or);border-radius:16px;padding:10px;margin-top:6px}.venn div div{background:var(--orl)}
.ph{border:1px dashed var(--bd);border-radius:12px;padding:10px 18px;color:var(--mu)}
details{border:1px solid var(--bd);border-radius:12px;padding:4px 16px;margin:8px 0}summary{cursor:pointer;font-weight:600}
@media(max-width:700px){body{font-size:16px}h1{font-size:1.7em}}
</style></head><body>
<header><b>Machine Learning Academy</b><nav id="nav"></nav></header><main id="main"></main>
<script>
const $=s=>document.querySelector(s);
// ساختار داده: برای افزودن صفحه‌ی کامل یک الگوریتم فقط فیلد آخر (آدرس صفحه) را پر کنید
// [نام, نام فارسی, دسته, کاربرد اصلی, توضیح مختصر, آدرس صفحه آموزش (اختیاری)]
const C={S:'Supervised',U:'Unsupervised',SS:'Semi-Supervised',R:'Reinforcement',D:'Deep Learning'};
const A=[
['Linear Regression','رگرسیون خطی','S','پیش‌بینی مقدار عددی','یک خط یا ابرصفحه را به داده برازش می‌کند.'],
['Logistic Regression','رگرسیون لجستیک','S','دسته‌بندی','احتمال تعلق نمونه به کلاس مثبت را با تابع سیگموید تخمین می‌زند.','/logistic'],
['Decision Tree','درخت تصمیم','S','دسته‌بندی و رگرسیون','با پرسش‌های متوالی درباره ویژگی‌ها، داده را به گروه‌های کوچک‌تر تقسیم می‌کند.'],
['Random Forest','جنگل تصادفی','S','دسته‌بندی و رگرسیون','مجموعه‌ای از درخت‌های تصمیم را ترکیب می‌کند تا پایدارتر شود.'],
['Support Vector Machine (SVM)','ماشین بردار پشتیبان','S','دسته‌بندی','مرزی با بیشترین حاشیه بین کلاس‌ها پیدا می‌کند.'],
['K-Nearest Neighbors (KNN)','k نزدیک‌ترین همسایه','S','دسته‌بندی و رگرسیون','بر اساس k نمونه نزدیک در داده آموزشی تصمیم می‌گیرد.'],
['Naive Bayes','بیز ساده','S','دسته‌بندی (مثلاً متن)','از قاعده بیز و فرض استقلال ویژگی‌ها استفاده می‌کند.'],
['Gradient Boosting','تقویت گرادیانی','S','داده‌های جدولی','مدل‌های ساده را پشت‌سرهم می‌سازد و هر مدل خطای قبلی را اصلاح می‌کند.'],
['XGBoost','ایکس‌جی‌بوست','S','داده‌های جدولی','پیاده‌سازی بهینه‌شده Gradient Boosting.'],
['LightGBM','لایت‌جی‌بی‌ام','S','داده‌های جدولی بزرگ','پیاده‌سازی سریع و کم‌مصرف Gradient Boosting.'],
['K-Means','کا-میانگین','U','خوشه‌بندی','نمونه‌ها را به k خوشه با مراکز مشخص تقسیم می‌کند.'],
['Hierarchical Clustering','خوشه‌بندی سلسله‌مراتبی','U','خوشه‌بندی','ساختاری درخت‌مانند از ادغام یا تفکیک خوشه‌ها می‌سازد.'],
['DBSCAN','دی‌بی‌اسکن','U','خوشه‌بندی و یافتن نقاط پرت','خوشه‌ها را بر اساس چگالی نقاط پیدا می‌کند.'],
['Principal Component Analysis (PCA)','تحلیل مؤلفه‌های اصلی','U','کاهش ابعاد','داده را روی جهت‌هایی با بیشترین واریانس تصویر می‌کند.'],
['Gaussian Mixture Model (GMM)','مدل مخلوط گاوسی','U','خوشه‌بندی احتمالاتی','داده را ترکیبی از چند توزیع گاوسی در نظر می‌گیرد.'],
['Apriori','اپریوری','U','کشف قوانین انجمنی','مجموعه‌های پرتکرار اقلام (مثل سبد خرید) را پیدا می‌کند.'],
['Self-Training','خودآموزی','SS','استفاده از داده بدون برچسب','مدل با اطمینان بالاترین پیش‌بینی‌هایش را به‌عنوان برچسب موقت به داده آموزشی اضافه می‌کند.'],
['Co-Training','هم‌آموزی','SS','استفاده از داده بدون برچسب','دو مدل روی دو دید مختلف از داده به یکدیگر برچسب می‌دهند.'],
['Label Propagation','انتشار برچسب','SS','استفاده از ساختار گراف','برچسب‌ها را از نمونه‌های برچسب‌دار روی گراف شباهت منتشر می‌کند.'],
['Label Spreading','پخش برچسب','SS','استفاده از ساختار گراف','شبیه انتشار برچسب با نرمال‌سازی گراف و تحمل بهتر نویز.'],
['Q-Learning','یادگیری Q','R','یادگیری سیاست بهینه','ارزش هر جفت وضعیت–اقدام را جدول‌وار تخمین می‌زند.'],
['Deep Q-Network (DQN)','شبکه Q عمیق','R','محیط‌های با وضعیت‌های زیاد','تابع Q را با شبکه عصبی تقریب می‌زند.'],
['SARSA','سارسا','R','یادگیری سیاست','مشابه Q-Learning ولی بر اساس اقدامی که سیاست جاری واقعاً انجام می‌دهد.'],
['Policy Gradient','گرادیان سیاست','R','یادگیری مستقیم سیاست','پارامترهای سیاست را در جهت افزایش پاداش مورد انتظار به‌روز می‌کند.'],
['Actor-Critic','بازیگر–منتقد','R','یادگیری سیاست و ارزش','یک بخش سیاست را می‌آموزد و بخش دیگر کیفیت آن را ارزیابی می‌کند.'],
['Proximal Policy Optimization (PPO)','بهینه‌سازی سیاست پروگزیمال','R','یادگیری پایدار سیاست','تغییر سیاست را در هر به‌روزرسانی محدود می‌کند تا آموزش پایدار بماند.'],
['Artificial Neural Networks (ANN)','شبکه‌های عصبی مصنوعی','D','پایه مدل‌های عمیق','لایه‌هایی از نورون‌ها که ورودی را به‌تدریج به نمایش‌های مفیدتر تبدیل می‌کنند.'],
['Convolutional Neural Networks (CNN)','شبکه‌های عصبی کانولوشنی','D','تصویر و داده‌های شبکه‌ای','با فیلترهای کانولوشنی الگوهای محلی را استخراج می‌کنند.'],
['Recurrent Neural Networks (RNN)','شبکه‌های عصبی بازگشتی','D','داده‌های ترتیبی','وضعیت درونی را در طول دنباله حفظ می‌کنند.'],
['Transformers','ترنسفورمرها','D','متن و داده‌های ترتیبی','با مکانیزم توجه (Attention) روابط بین عناصر دنباله را مدل می‌کنند.']];
const catFa={S:'نظارت‌شده',U:'بدون نظارت',SS:'نیمه‌نظارتی',R:'تقویتی',D:'یادگیری عمیق'};
const card=a=>`<div class=card><span class=tag>${C[a[2]]}</span> <span class=tag>${catFa[a[2]]}</span><h3 dir=ltr style="text-align:right">${a[0]}</h3><b>${a[1]}</b><p style="margin:2px 0">کاربرد اصلی: ${a[3]}</p><p style="margin:2px 0;color:var(--mu);font-size:15px">${a[4]}</p><span class="st ${a[5]?'ok':''}">${a[5]?'آموزش کامل موجود است':'معرفی اولیه · آموزش تفصیلی به‌زودی'}</span>${a[5]?` <a class="btn s" href="${a[5]}">ورود</a>`:''}</div>`;
const li=k=>'<ul>'+A.filter(a=>a[2]==k).map(a=>`<li><b dir=ltr>${a[0]}</b> (${a[1]}): ${a[4]} <span style="color:var(--mu)">کاربرد: ${a[3]}</span></li>`).join('')+'</ul>';
const flow=a=>`<div class=flow>${a.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div>`;
const T=[
{k:'S',en:'Supervised Learning',fa:'یادگیری نظارت‌شده',def:'مدل با استفاده از داده‌های برچسب‌گذاری‌شده آموزش می‌بیند. یعنی برای نمونه‌های آموزشی، هم ویژگی‌های ورودی و هم خروجی یا برچسب واقعی مشخص است.',simple:'مانند معلمی که کنار هر سؤال، پاسخ درست را هم نشان می‌دهد.',how:'مدل پیش‌بینی می‌کند، پیش‌بینی با برچسب واقعی مقایسه می‌شود و پارامترها برای کاهش خطا اصلاح می‌شوند.',ex:'پیش‌بینی قبولی دانشجو از ساعت مطالعه (Classification) یا قیمت خانه از متراژ (Regression).',fl:['ویژگی + برچسب','آموزش مدل','پیش‌بینی نمونه جدید'],extra:'<p>دو مسئله اصلی: <b>الف) Regression</b> — پیش‌بینی مقادیر عددی؛ <b>ب) Classification</b> — پیش‌بینی کلاس یا دسته.</p>'},
{k:'U',en:'Unsupervised Learning',fa:'یادگیری بدون نظارت',def:'مدل با داده‌های بدون برچسب کار می‌کند و تلاش می‌کند ساختارها، الگوها و روابط پنهان موجود در داده‌ها را شناسایی کند.',simple:'داده‌ها بدون پاسخ در اختیار مدل‌اند و مدل خودش گروه‌ها یا ساختار را پیدا می‌کند.',how:'مدل شباهت و فاصله نمونه‌ها یا ساختار کم‌بعد داده را بررسی می‌کند.',ex:'گروه‌بندی مشتریان یک فروشگاه بر اساس رفتار خرید.',fl:['داده بدون برچسب','کشف الگو','خوشه‌ها / ساختار'],extra:''},
{k:'SS',en:'Semi-Supervised Learning',fa:'یادگیری نیمه‌نظارتی',def:'در این روش از ترکیب داده‌های برچسب‌دار و بدون برچسب برای آموزش مدل استفاده می‌شود.',simple:'برچسب‌گذاری پرهزینه است؛ پس از تعداد کمی نمونه برچسب‌دار و تعداد زیادی نمونه بدون برچسب استفاده می‌کنیم.',how:'مدل اولیه با داده برچسب‌دار ساخته می‌شود و ساختار داده‌های بدون برچسب برای بهبود یا برچسب‌گذاری موقت به کار می‌رود.',ex:'دسته‌بندی تصاویر پزشکی که فقط بخش کوچکی از آن‌ها برچسب خورده است.',fl:['کم: برچسب‌دار','زیاد: بدون برچسب','مدل بهتر'],extra:''},
{k:'R',en:'Reinforcement Learning',fa:'یادگیری تقویتی',def:'عامل هوشمند با تعامل با محیط و دریافت پاداش یا جریمه یاد می‌گیرد تصمیم‌های بهتری بگیرد.',simple:'عامل با آزمون‌وخطا می‌آموزد کدام اقدام‌ها در بلندمدت پاداش بیشتری دارند.',how:'در هر گام عامل وضعیت را می‌بیند، اقدام می‌کند، پاداش می‌گیرد و سیاست خود را بهبود می‌دهد.',ex:'آموزش عامل بازی یا کنترل یک ربات.',fl:['State','Action','Reward','Policy'],extra:'<p>مفاهیم کلیدی: <b>Agent</b> (تصمیم‌گیرنده)، <b>Environment</b> (محیط)، <b>State</b> (وضعیت)، <b>Action</b> (اقدام)، <b>Reward</b> (پاداش)، <b>Policy</b> (قاعده انتخاب اقدام در هر وضعیت).</p>'}];
const I=[['تعریف Machine Learning','یادگیری ماشین یعنی ساخت سیستم‌هایی که الگوها را از داده یاد می‌گیرند، به‌جای آنکه همه قواعد را برنامه‌نویس صریحاً بنویسد.'],['برنامه‌نویسی سنتی در برابر یادگیری ماشین','در برنامه‌نویسی سنتی «قواعد + داده» به «پاسخ» می‌رسد؛ در یادگیری ماشین «داده + پاسخ‌های نمونه» به «قواعد» (مدل) می‌رسد.'],['Dataset','مجموعه‌ای از نمونه‌ها (مثلاً دانشجویان) که برای آموزش و ارزیابی استفاده می‌شود.'],['Features','ویژگی‌های ورودی هر نمونه، مثل ساعت مطالعه یا متراژ خانه.'],['Labels','خروجی واقعی مطلوب هر نمونه، مثل قبول/مردود یا قیمت.'],['Model','تابعی با پارامترهای قابل یادگیری که ویژگی‌ها را به خروجی نگاشت می‌کند.'],['Training','تنظیم پارامترهای مدل با استفاده از داده آموزشی.'],['Testing','سنجش مدل روی داده‌ای که در آموزش دیده نشده است.'],['Prediction','تولید خروجی مدل برای نمونه‌ای جدید.'],['Evaluation','اندازه‌گیری کیفیت مدل با معیارهایی مانند Accuracy، Precision و Recall.'],['Training Data و Test Data','داده آموزشی برای یادگیری و داده آزمون برای ارزیابی صادقانه تعمیم‌پذیری مدل است؛ این دو باید جدا باشند.']];
const P={
home(){return `<div class=hero><span class=tag>مرجع آموزشی یادگیری ماشین</span><h1>Machine Learning Academy</h1><p style="margin:0;font-weight:600">دکتر مهدی باقری‌زاده — عضو هیئت علمی مهندسی کامپیوتر</p><p>به آکادمی یادگیری ماشین خوش آمدید.</p><p>در این وب‌سایت با مفاهیم بنیادی یادگیری ماشین، انواع روش‌های یادگیری، الگوریتم‌های مهم، مثال‌های کاربردی و پیاده‌سازی عملی مدل‌ها با Python و Scikit-Learn آشنا می‌شوید.</p><p>هدف این مجموعه، ارائه یک مرجع آموزشی منظم و کاربردی برای دانشجویان است تا علاوه بر درک مفاهیم نظری، بتوانند الگوریتم‌های یادگیری ماشین را در مسائل واقعی به کار بگیرند.</p><p>محتوای آموزشی این آکادمی بر پایه منابع علمی معتبر، به‌ویژه کتاب Hands-On Machine Learning، طراحی و توسعه می‌یابد.</p><a class=btn href="/logistic">ورود به آموزش Logistic Regression</a><a class="btn s" href="/jozve">جزوه کامل</a></div>
<h2>مدرس</h2><div class=card><h3>دکتر مهدی باقری‌زاده</h3>عضو هیئت علمی گروه مهندسی کامپیوتر<br>حوزه تخصصی: هوش مصنوعی، یادگیری ماشین، سیستم‌های هوشمند، فناوری و نوآوری</div>
<h2>درباره درس</h2><p>درس یادگیری ماشین برای دانشجویان کارشناسی ارشد و دکتری مهندسی کامپیوتر؛ از مفاهیم پایه تا الگوریتم‌ها و پیاده‌سازی با Python. <a href="#intro">مقدمه‌ای بر یادگیری ماشین ←</a></p>
<h2>چهار نوع اصلی یادگیری ماشین</h2><div class=grid>${T.map(t=>`<a href="#types" onclick="go='${t.k}'" style="text-decoration:none;color:inherit"><div class=card><span class=tag>${t.en}</span><h3>${t.fa}</h3><span style="font-size:15px;color:var(--mu)">${t.def.slice(0,70)}…</span></div></a>`).join('')}</div>
<h2>دسته‌بندی الگوریتم‌ها</h2><p>${A.length} الگوریتم و روش در ۵ دسته. <a href="#algos">مرجع الگوریتم‌ها ←</a></p>
<h2>پروژه‌ها و فعالیت‌های دانشجویی</h2><p>دانشجویان در طول ترم یک الگوریتم را انتخاب، تحقیق و در کلاس ارائه می‌کنند. <a href="#projects">راهنمای ارائه ←</a></p>
<h2>منبع اصلی درس</h2><div class=card dir=ltr style="text-align:left"><b>Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow</b><br>Aurélien Géron, Third Edition, 2022</div>

intro(){return `<h1>مقدمه‌ای بر یادگیری ماشین</h1><p>مرور مفاهیم پایه‌ای که در همه الگوریتم‌های بعدی تکرار می‌شوند.</p><div class=grid>${I.map((x,i)=>`<div class=card><b>${i+1}. ${x[0]}</b><div style="font-size:15px">${x[1]}</div></div>`).join('')}</div><h2>۱۲. فرایند یادگیری ماشین</h2>${flow(['Data','Preprocessing','Training','Model','Prediction','Evaluation'])}<p style="color:var(--mu)">داده پس از پیش‌پردازش برای آموزش به مدل داده می‌شود؛ مدل آموزش‌دیده پیش‌بینی می‌کند و کیفیت پیش‌بینی ارزیابی می‌شود.</p>`},
